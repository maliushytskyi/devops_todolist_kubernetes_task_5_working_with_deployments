apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapp
  namespace: mateapp
  labels:
    app: todoapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todoapp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: todoapp
    spec:
      containers:
        - name: todoapp
          # Same image/ports as in the pod manifest; replace with your Docker Hub image
          image: mavik27/todoapp:2.0.0
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
